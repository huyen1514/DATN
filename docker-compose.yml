services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    container_name: dotnet_backend
    env_file:
      - .env
    ports:
      - "5135:5135"
    volumes:
      - ./backend:/app
      # Uploads nằm ngoài /app để dotnet watch không scan → không crash/restart
      - uploads_data:/data/uploads
    working_dir: /app
    # Không dùng --seed mặc định để restart nhanh hơn.
    # Lần đầu hoặc khi cần seed lại: docker compose run --rm backend dotnet run -- --seed
    command: dotnet watch run --urls "http://0.0.0.0:5135"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5135"
      ConnectionStrings__DefaultConnection: Server=db;Database=JapaneseLearningDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_SECRET}
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      # Lưu uploads ra ngoài thư mục project để dotnet watch không theo dõi
      UPLOADS_PATH: "/data/uploads"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:5

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  sql_data:
  uploads_data:
